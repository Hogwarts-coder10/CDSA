name: CDSA Engine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  fuzz-and-benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Tools & Valgrind
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc valgrind

    - name: Configure Engine Build
      run: cmake -B build-bench -DCMAKE_BUILD_TYPE=Release

    - name: Compile CDSA Suite
      run: cmake --build build-bench

    - name: Execute Chaos Monkey with Valgrind Memcheck
      run: |
        # Find the exact path of the compiled binary dynamically
        FUZZER_PATH=$(find build-bench -name "bench_fuzzer" -type f | head -n 1)
        echo "Found fuzzer at: $FUZZER_PATH"
        
        # Execute Valgrind on the discovered path
        valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 $FUZZER_PATH

