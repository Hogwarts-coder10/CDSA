name: CDSA Engine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  fuzz-and-benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Tools & Valgrind
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc valgrind

    - name: Configure Engine Build
      # We added the -DCDSA_BUILD_BENCHMARKS=ON flag here so CMake actually builds the fuzzer
      run: cmake -B build-bench -DCMAKE_BUILD_TYPE=Release -DCDSA_BUILD_BENCHMARKS=ON

    - name: Compile CDSA Suite
      run: cmake --build build-bench

    - name: Execute Chaos Monkey with Valgrind Memcheck
      # Now that we know exactly where it compiles, we run it straight from the source
      run: valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 ./build-bench/bench_fuzzer

    - name: Configure Sanitized Build
      run: cmake -B build-san -DCMAKE_BUILD_TYPE=Debug -DCDSA_USE_SANITIZERS=ON

    - name: Compile Sanitized Suite
      run: cmake --build build-san

    - name: Run Unit Tests Under ASan/UBSan
      run: cd build-san && ctest --output-on-failure


